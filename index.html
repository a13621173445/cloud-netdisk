<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>frpz.cc</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .landing-card {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 48px 40px;
            text-align: center;
        }
        .landing-card h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #1d1d1f;
        }
        .landing-card p {
            color: #86868b;
            margin-bottom: 36px;
            font-size: 15px;
        }
        .landing-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .landing-btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            background: #ffffff;
            color: #1d1d1f;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s;
        }
        .landing-btn:hover {
            background: #f0f0f5;
            border-color: #0071e3;
            color: #0071e3;
        }
        .landing-btn.primary {
            background: #0071e3;
            color: #ffffff;
            border-color: #0071e3;
            font-weight: 600;
        }
        .landing-btn.primary:hover {
            background: #0077ed;
            border-color: #0077ed;
        }
        .landing-btn-empty {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border: 1px dashed #c7c7cc;
            border-radius: 10px;
            background: transparent;
            color: #aeaeb2;
            font-size: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="landing-card">
        <h1>frpz.cc</h1>
        <p>欢迎来到 frpz.cc</p>

        <div class="landing-buttons">
            <a href="netdisk/index.html" class="landing-btn primary">进入网盘</a>
            <div class="landing-btn-empty"></div>
            <div class="landing-btn-empty"></div>
            <div class="landing-btn-empty"></div>
            <div class="landing-btn-empty"></div>
        </div>
    </div>
</body>
</html>
