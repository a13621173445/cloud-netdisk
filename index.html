<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>frpz.cc</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .landing-card {
            max-width: 420px;
            width: 100%;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            padding: 48px 32px 36px;
            text-align: center;
        }
        .landing-card h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 36px;
            color: #1d1d1f;
        }
        .landing-btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            margin-bottom: 12px;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            background: #ffffff;
            color: #1d1d1f;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s;
        }
        .landing-btn:hover {
            background: #f0f0f5;
            border-color: #0071e3;
            color: #0071e3;
        }
        .landing-btn.primary {
            background: #0071e3;
            border-color: #0071e3;
            color: #ffffff;
            font-weight: 600;
        }
        .landing-btn.primary:hover {
            background: #0077ed;
            border-color: #0077ed;
        }
        .landing-btn-empty {
            display: block;
            width: 100%;
            padding: 14px 20px;
            margin-bottom: 12px;
            border: 2px dashed #d2d2d7;
            border-radius: 10px;
            background: #fafafa;
            color: #aeaeb2;
            font-size: 14px;
            text-align: center;
        }

    <div class="landing-card">
        <h1>frpz.cc</h1>
