<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>frpz.cc</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .landing-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: var(--bg);
        }
        .landing-card {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 48px 40px;
            text-align: center;
        }
        .landing-card h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: var(--text);
        }
        .landing-card p {
            color: var(--text-light);
            margin-bottom: 36px;
            font-size: 15px;
        }
        .landing-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .landing-btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--card-bg);
            color: var(--text);
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .landing-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }
        .landing-btn.primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            font-weight: 600;
        }
        .landing-btn.primary:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }
        .landing-btn-empty {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border: 1px dashed var(--border);
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-light);
            font-size: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="landing-wrapper">
        <div class="landing-card">
            <h1>frpz.cc</h1>
            <p>欢迎来到 frpz.cc</p>

            <div class="landing-buttons">
                <a href="netdisk/index.html" class="landing-btn primary">进入网盘</a>
                <div class="landing-btn-empty"></div>
                <div class="landing-btn-empty"></div>
                <div class="landing-btn-empty"></div>
                <div class="landing-btn-empty"></div>
            </div>
        </div>
    </div>
</body>
</html>
