<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户协议 - Cloud Netdisk</title>
    <link rel="stylesheet" href="css/style.css?v=8">
    <style>
        .eula-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: var(--bg);
        }
        .eula-card {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 48px 40px;
            text-align: center;
        }
        .eula-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .eula-card h1 {
            font-size: 24px;
            margin-bottom: 24px;
            color: var(--text);
        }
        .eula-warning {
            background: #FEF2F2;
            border: 1px solid #FEE2E2;
            border-radius: var(--radius-sm);
            padding: 20px;
            margin-bottom: 32px;
            text-align: left;
            line-height: 1.8;
            font-size: 15px;
            color: #991B1B;
        }
        .eula-warning strong {
            font-weight: 700;
        }
        .eula-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 32px;
        }
        .eula-actions .btn {
            min-width: 140px;
            padding: 12px 32px;
            font-size: 16px;
        }
        .eula-footer {
            font-size: 13px;
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <div class="eula-wrapper">
        <div class="eula-card">
            <div class="eula-icon">⚠️</div>
            <h1>用户协议</h1>

            <div class="eula-warning">
                <strong>请自重，不要上传违法违规文件，</strong>否则将追究责任并最高可能永久注销并删除你的账户和所有文件。
            </div>

            <div class="eula-actions">
                <a href="https://baidu.com" class="btn btn-secondary">退出</a>
                <a href="index" class="btn btn-primary" id="agree-btn">确定</a>
            </div>

            <div class="eula-footer">
                保留所有权利，a13621173445@2026
            </div>
        </div>
    </div>

    <script>
        document.getElementById('agree-btn').addEventListener('click', () => {
            localStorage.setItem('netdisk_eula_agreed', 'true');
        });
    </script>
</body>
</html>
