<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - GitHub Netdisk</title>
    <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <h1>GitHub Netdisk</h1>
                <p>登录你的网盘</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="输入密码" required autocomplete="current-password">
                </div>

                <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="remember-me" style="width: auto; cursor: pointer;">
                    <label for="remember-me" style="margin: 0; cursor: pointer; font-size: 14px;">记住我（30 天内自动登录）</label>
                </div>

                <button type="submit" class="btn btn-primary" id="login-btn">登录</button>
            </form>

            <div class="mt-24 text-center">
                <a href="register.html" class="link">没有账号？立即注册</a>
            </div>

            <div class="mt-16 text-center">
                <a href="reset.html" class="link">忘记密码？</a>
            </div>

            <div id="resend-section" style="display: none; margin-top: 20px;">
                <div class="alert alert-warning" style="font-size: 13px;">
                    邮箱未验证，无法登录。<br>
                    <a href="#" id="resend-link" class="link">重新发送验证邮件</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js?v=8"></script>
    <script src="js/github.js?v=6"></script>
    <script src="js/netdisk.js?v=11"></script>
    <script src="js/ui.js?v=8"></script>
    <script>
        (async () => {
            if (!(await CONFIG.isConfigured())) {
                document.getElementById('login-form').innerHTML = '<div class="alert alert-error" style="text-align:center;padding:40px;"><h3>系统未配置</h3><p style="margin-top:12px;color:var(--text-light);">请检查 config.js 中的 Token 配置是否正确。</p></div>';
                return;
            }

            if (Netdisk.getCurrentUserLocal()) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const autoLogin = await Netdisk.checkAutoLogin();
                if (autoLogin) {
                    UI.showMessage('自动登录成功！', 'success');
                    setTimeout(() => window.location.href = 'index.html', 500);
                }
            } catch (e) {
            }
        })();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.textContent = '登录中...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember-me').checked;

            try {
                const result = await Netdisk.login(email, password, rememberMe);
                UI.showMessage('登录成功！', 'success');
                setTimeout(() => window.location.href = 'index.html', 800);
            } catch (error) {
                UI.showMessage(error.message, 'error');
                btn.disabled = false;
                btn.textContent = '登录';

                if (error.message.includes('邮箱未验证')) {
                    document.getElementById('resend-section').style.display = 'block';
                    document.getElementById('resend-link').onclick = async (ev) => {
                        ev.preventDefault();
                        try {
                            await Netdisk.resendVerification(email);
                            UI.showMessage('验证邮件已发送', 'success');
                        } catch (e) {
                            UI.showMessage(e.message, 'error');
                        }
                    };
                }
            }
        });
    </script>
</body>
</html>
