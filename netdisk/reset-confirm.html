<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置新密码 - GitHub Netdisk</title>
    <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <h1>GitHub Netdisk</h1>
                <p>设置新密码</p>
            </div>

            <div id="form-section">
                <form id="reset-confirm-form">
                    <div class="form-group">
                        <label>新密码</label>
                        <input type="password" id="new-password" placeholder="至少 6 个字符" required minlength="6">
                    </div>

                    <div class="form-group">
                        <label>确认新密码</label>
                        <input type="password" id="confirm-password" placeholder="再次输入新密码" required>
                    </div>

                    <button type="submit" class="btn btn-primary" id="confirm-btn">重置密码</button>
                </form>
            </div>

            <div class="mt-24 text-center">
                <a href="login.html" class="link">返回登录</a>
            </div>
        </div>
    </div>

    <script src="js/config.js?v=5"></script>
    <script src="js/github.js?v=5"></script>
    <script src="js/netdisk.js?v=6"></script>
    <script src="js/ui.js?v=8"></script>
    <script>
        if (!CONFIG.isConfigured()) {
            window.location.href = 'setup.html';
        }

        const token = UI.getQueryParam('token');

        if (!token) {
            document.getElementById('form-section').innerHTML = `
                <div class="alert alert-error">重置链接无效，缺少必要参数。</div>
            `;
        }

        document.getElementById('reset-confirm-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('confirm-btn');
            const newPwd = document.getElementById('new-password').value;
            const confirmPwd = document.getElementById('confirm-password').value;

            if (newPwd !== confirmPwd) {
                UI.showMessage('两次密码不一致', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '重置中...';

            try {
                await Netdisk.resetPassword(token, newPwd);

                document.getElementById('form-section').innerHTML = `
                    <div class="alert alert-success">
                        <strong>密码重置成功！</strong><br>
                        请使用新密码登录。
                    </div>
                    <a href="login.html" class="btn btn-primary" style="margin-top: 16px;">前往登录</a>
                `;
            } catch (error) {
                UI.showMessage(error.message, 'error');
                btn.disabled = false;
                btn.textContent = '重置密码';
            }
        });
    </script>
</body>
</html>
