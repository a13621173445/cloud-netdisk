<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - GitHub Netdisk</title>
    <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <h1>GitHub Netdisk</h1>
                <p>重置密码</p>
            </div>

            <div id="reset-form-section">
                <div class="alert alert-info">
                    输入注册邮箱，我们将发送密码重置链接到你的邮箱。
                </div>

                <form id="reset-form">
                    <div class="form-group">
                        <label>邮箱地址</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>

                    <button type="submit" class="btn btn-primary" id="reset-btn">发送重置邮件</button>
                </form>
            </div>

            <div class="mt-24 text-center">
                <a href="login.html" class="link">返回登录</a>
            </div>
        </div>
    </div>

    <script src="js/config.js?v=6"></script>
    <script src="js/github.js?v=5"></script>
    <script src="js/netdisk.js?v=9"></script>
    <script src="js/ui.js?v=8"></script>
    <script>
        if (!CONFIG.isConfigured()) {
            window.location.href = 'setup.html';
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('reset-btn');
            const email = document.getElementById('email').value.trim();

            btn.disabled = true;
            btn.textContent = '发送中...';

            try {
                await Netdisk.requestPasswordReset(email);

                document.getElementById('reset-form-section').innerHTML = `
                    <div class="alert alert-success">
                        <strong>邮件已发送！</strong><br>
                        密码重置链接已发送到 <strong>${UI.escapeHtml(email)}</strong><br>
                        请查收邮件并在 30 分钟内完成重置。
                    </div>
                `;
            } catch (error) {
                UI.showMessage(error.message, 'error');
                btn.disabled = false;
                btn.textContent = '发送重置邮件';
            }
        });
    </script>
</body>
</html>
