<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分享文件 - GitHub Netdisk</title>
    <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
    <div class="share-wrapper">
        <div class="share-card">
            <div id="share-content">
                <div class="result-icon">⏳</div>
                <h2>加载中...</h2>
                <p>正在获取文件信息</p>
            </div>
        </div>
    </div>

    <script src="js/config.js?v=5"></script>
    <script src="js/github.js?v=5"></script>
    <script src="js/netdisk.js?v=6"></script>
    <script src="js/ui.js?v=8"></script>
    <script>
        (async () => {
            if (!CONFIG.isConfigured()) {
                document.getElementById('share-content').innerHTML = `
                    <div class="result-icon">⚠️</div>
                    <h2>配置错误</h2>
                    <p>网盘尚未完成初始化配置。</p>
                `;
                return;
            }

            const token = UI.getQueryParam('token');

            if (!token) {
                document.getElementById('share-content').innerHTML = `
                    <div class="result-icon">⚠️</div>
                    <h2>链接无效</h2>
                    <p>分享链接缺少必要参数。</p>
                `;
                return;
            }

            try {
                const file = await Netdisk.getSharedFile(token);

                // 分享限制信息
                const expireText = file.expireDays === -1 ? '无限制' : `${file.expireDays} 天`;
                const downloadText = file.maxDownloads === -1 ? '无限制' : `${file.downloadCount}/${file.maxDownloads} 次`;

                document.getElementById('share-content').innerHTML = `
                    <div class="share-file-icon">${UI.getFileIcon(file.type, file.name)}</div>
                    <div class="share-file-name">${UI.escapeHtml(file.name)}</div>
                    <div class="share-file-meta">
                        ${UI.formatFileSize(file.size)} · 上传于 ${UI.formatDate(file.uploadedAt)}
                    </div>
                    <div class="share-file-meta" style="margin-top: 8px;">
                        有效期：${expireText} · 下载次数：${downloadText}
                    </div>
                    <a href="${UI.escapeHtml(file.url)}" class="btn btn-primary" style="margin-top: 24px;" download="${UI.escapeHtml(file.name)}">
                        下载文件
                    </a>
                `;
            } catch (error) {
                document.getElementById('share-content').innerHTML = `
                    <div class="result-icon">❌</div>
                    <h2>无法访问</h2>
                    <p>${UI.escapeHtml(error.message)}</p>
                    <p class="text-muted" style="margin-top: 12px;">分享链接可能已失效或被取消。</p>
                `;
            }
        })();
    </script>
</body>
</html>
