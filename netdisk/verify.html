<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮箱验证 - GitHub Netdisk</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="result-wrapper">
        <div class="result-card">
            <div id="result-content">
                <div class="result-icon">⏳</div>
                <h2>正在验证...</h2>
                <p>请稍候，正在验证你的邮箱地址</p>
            </div>
        </div>
    </div>

    <script src="js/config.js?v=5"></script>
    <script src="js/github.js?v=5"></script>
    <script src="js/netdisk.js?v=5"></script>
    <script src="js/ui.js?v=5"></script>
    <script>
        (async () => {
            const token = UI.getQueryParam('token');

            if (!token) {
                document.getElementById('result-content').innerHTML = `
                    <div class="result-icon">⚠️</div>
                    <h2>链接无效</h2>
                    <p>验证链接缺少必要参数，请检查邮件中的链接是否完整。</p>
                    <a href="login.html" class="btn btn-primary" style="margin-top: 16px;">前往登录</a>
                `;
                return;
            }

            try {
                const result = await Netdisk.verifyEmail(token);
                document.getElementById('result-content').innerHTML = `
                    <div class="result-icon">✅</div>
                    <h2>验证成功</h2>
                    <p>你的邮箱已验证完成，现在可以登录使用了。</p>
                    <a href="login.html" class="btn btn-primary" style="margin-top: 16px;">前往登录</a>
                `;
            } catch (error) {
                document.getElementById('result-content').innerHTML = `
                    <div class="result-icon">❌</div>
                    <h2>验证失败</h2>
                    <p>${UI.escapeHtml(error.message)}</p>
                    <a href="login.html" class="btn btn-secondary" style="margin-top: 16px;">前往登录</a>
                `;
            }
        })();
    </script>
</body>
</html>
