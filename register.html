<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - GitHub Netdisk</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <h1>GitHub Netdisk</h1>
                <p>创建新账号</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" placeholder="至少 2 个字符" required minlength="2" maxlength="20">
                </div>

                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="至少 6 个字符" required minlength="6">
                </div>

                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="confirmPassword" placeholder="再次输入密码" required>
                </div>

                <button type="submit" class="btn btn-primary" id="register-btn">注册</button>
            </form>

            <div class="mt-24 text-center">
                <a href="login.html" class="link">已有账号？前往登录</a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/github.js"></script>
    <script src="js/netdisk.js"></script>
    <script src="js/ui.js"></script>
    <script>
        if (!CONFIG.isConfigured()) {
            window.location.href = 'setup.html';
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('register-btn');
            btn.disabled = true;
            btn.textContent = '注册中...';

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                UI.showMessage('两次输入的密码不一致', 'error');
                btn.disabled = false;
                btn.textContent = '注册';
                return;
            }

            try {
                UI.showLoading('注册中...');
                const result = await Netdisk.register(username, email, password);
                UI.hideLoading();

                // 显示成功提示
                document.querySelector('.auth-card').innerHTML = `
                    <div class="auth-logo">
                        <h1>GitHub Netdisk</h1>
                    </div>
                    <div class="alert alert-success">
                        <strong>注册成功！</strong><br>
                        验证邮件已发送到 <strong>${UI.escapeHtml(email)}</strong><br>
                        请查收邮件并点击验证链接完成验证。
                    </div>
                    <div class="mt-24 text-center">
                        <a href="login.html" class="btn btn-secondary">前往登录</a>
                    </div>
                `;
            } catch (error) {
                UI.hideLoading();
                UI.showMessage(error.message, 'error');
                btn.disabled = false;
                btn.textContent = '注册';
            }
        });
    </script>
</body>
</html>
